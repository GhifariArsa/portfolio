<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #282c34; }
  </style>
</helmet>

<div style="width:100vw;height:100vh;background:#282c34;color:#abb2bf;font-family:'JetBrains Mono',monospace;display:flex;flex-direction:column;overflow:hidden;">

  <div style="height:36px;flex-shrink:0;background:#21252b;border-bottom:1px solid #181a1f;display:flex;align-items:center;padding:0 12px;gap:16px;">
    <div style="display:flex;gap:8px;">
      <div style="width:12px;height:12px;border-radius:50%;background:#e06c75;"></div>
      <div style="width:12px;height:12px;border-radius:50%;background:#e5c07b;"></div>
      <div style="width:12px;height:12px;border-radius:50%;background:#98c379;"></div>
    </div>
    <div style="flex:1;text-align:center;font-size:13px;color:#5c6370;">ghifari@portfolio: ~/site</div>
    <div style="width:52px;"></div>
  </div>

  <div style="height:36px;flex-shrink:0;background:#21252b;border-bottom:1px solid #181a1f;display:flex;overflow-x:auto;">
    <a href="Home.dc.html" style="display:flex;align-items:center;padding:0 20px;font-size:13px;text-decoration:none;background:#21252b;color:#5c6370;border-top:2px solid transparent;border-right:1px solid #181a1f;">about.md</a>
    <a href="Experience.dc.html" style="display:flex;align-items:center;padding:0 20px;font-size:13px;text-decoration:none;background:#21252b;color:#5c6370;border-top:2px solid transparent;border-right:1px solid #181a1f;">experience.json</a>
    <a href="Projects.dc.html" style="display:flex;align-items:center;padding:0 20px;font-size:13px;text-decoration:none;background:#282c34;color:#abb2bf;border-top:2px solid #61afef;border-right:1px solid #181a1f;">projects/</a>
    <a href="Blog.dc.html" style="display:flex;align-items:center;padding:0 20px;font-size:13px;text-decoration:none;background:#21252b;color:#5c6370;border-top:2px solid transparent;border-right:1px solid #181a1f;">blog/</a>
  </div>

  <div style="flex:1;display:flex;overflow:hidden;">

    <div style="width:230px;flex-shrink:0;background:#21252b;border-right:1px solid #181a1f;padding:14px 0;overflow-y:auto;font-size:13.5px;">
      <div style="padding:0 14px 10px;color:#5c6370;font-size:11.5px;letter-spacing:.4px;text-transform:uppercase;">~/ghifari-arsa-ranandya</div>
      <sc-for list="{{ sidebarItems }}" as="it" hint-placeholder-count="6">
        <a href="{{ it.href }}" download="{{ it.download }}" ref="{{ it.refFn }}" style="{{ it.style }}">
          <span style="opacity:.7;width:12px;display:inline-block;">{{ it.glyph }}</span>{{ it.label }}
        </a>
      </sc-for>
    </div>

    <div style="flex:1;overflow-y:auto;">
      <div style="padding:28px 40px 60px;">
        <div style="font-size:13px;color:#5c6370;margin-bottom:18px;">~/projects $ ls -la</div>

        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;max-width:1000px;">
          <sc-for list="{{ projects }}" as="p" hint-placeholder-count="4">
            <a href="{{ p.href }}" target="_blank" ref="{{ p.refFn }}" style="{{ p.style }}">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
                <span style="color:#61afef;">▸</span>
                <span style="font-size:15.5px;font-weight:700;color:#e5c07b;">{{ p.name }}/</span>
              </div>
              <div style="font-size:13.5px;color:#b6bdc8;line-height:1.7;margin-bottom:12px;">{{ p.description }}</div>
              <div style="display:flex;flex-wrap:wrap;gap:6px;">
                <sc-for list="{{ p.tags }}" as="tag" hint-placeholder-count="3">
                  <span style="background:#21252b;color:#56b6c2;font-size:11.5px;padding:2px 8px;border-radius:4px;">{{ tag }}</span>
                </sc-for>
              </div>
            </a>
          </sc-for>
        </div>
      </div>
    </div>
  </div>

  <div style="height:26px;flex-shrink:0;display:flex;align-items:stretch;font-size:12px;">
    <div style="background:#98c379;color:#282c34;font-weight:700;display:flex;align-items:center;padding:0 12px;">NORMAL</div>
    <div style="background:#3a3f4b;color:#abb2bf;display:flex;align-items:center;padding:0 12px;">⎇ main</div>
    <div style="background:#2c313c;color:#5c6370;display:flex;align-items:center;padding:0 12px;">projects/</div>
    <div style="flex:1;background:#282c34;"></div>
    <div style="background:#2c313c;color:#5c6370;display:flex;align-items:center;padding:0 12px;">UTF-8</div>
    <div style="background:#3a3f4b;color:#abb2bf;display:flex;align-items:center;padding:0 14px;">{{ clockText }}</div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const SIDEBAR_CONFIG = [
  { kind: 'file', glyph: '≡', label: 'about.md', href: 'Home.dc.html', color: '#e5c07b' },
  { kind: 'file', glyph: '{}', label: 'experience.json', href: 'Experience.dc.html', color: '#98c379' },
  { kind: 'folder', glyph: '▸', label: 'projects/', href: 'Projects.dc.html', color: '#61afef' },
  { kind: 'folder', glyph: '▸', label: 'blog/', href: 'Blog.dc.html', color: '#61afef' },
  { kind: 'file', glyph: '$', label: 'contact.sh', href: 'Home.dc.html#contact', color: '#e06c75' },
  { kind: 'file', glyph: '⇩', label: 'Ghifari-CV.pdf', href: 'assets/Ghifari-Arsa-Ranandya-CV.pdf', color: '#c678dd', download: true },
];

const PROJECTS = [
  { name: 'lazyfetch', description: 'A tiny data-fetching layer with built-in caching and retries for React apps.', tags: ['TypeScript', 'React'], href: 'https://github.com/ghifariarsa' },
  { name: 'termfolio', description: 'This very site — a vim-navigable portfolio shell inspired by code editors.', tags: ['React', 'UX'], href: 'https://github.com/ghifariarsa' },
  { name: 'queue-lite', description: 'Minimal job queue for Node with Redis, built for side projects that outgrew cron.', tags: ['Node.js', 'Redis'], href: 'https://github.com/ghifariarsa' },
  { name: 'pg-snapshot', description: 'CLI that snapshots and restores Postgres schemas during local development.', tags: ['Python', 'Postgres'], href: 'https://github.com/ghifariarsa' },
];

function fmtClock() {
  const d = new Date();
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' · ' +
    d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}

class Component extends DCLogic {
  state = { focusIndex: 2, clockText: fmtClock() };

  constructor(props) {
    super(props);
    this.itemRefs = [];
    this.items = [
      ...SIDEBAR_CONFIG.map(c => ({ ...c, section: 'sidebar' })),
      ...PROJECTS.map(c => ({ ...c, section: 'content' })),
    ];
  }

  componentDidMount() {
    this._vimNav = new VimNavLocal({
      count: () => this.items.length,
      onMove: (i) => this.setState({ focusIndex: i }),
      onActivate: (i) => { const el = this.itemRefs[i]; if (el) el.click(); },
    });
    this._onKey = (e) => this._vimNav.handleKey(e, this.state.focusIndex);
    window.addEventListener('keydown', this._onKey);
    this._clockTimer = setInterval(() => this.setState({ clockText: fmtClock() }), 15000);
  }

  componentWillUnmount() {
    window.removeEventListener('keydown', this._onKey);
    clearInterval(this._clockTimer);
  }

  sidebarStyle(color, focused) {
    return focused
      ? { display: 'flex', alignItems: 'center', gap: 6, padding: '5px 14px', cursor: 'pointer', textDecoration: 'none', background: color, color: '#282c34', fontWeight: 600 }
      : { display: 'flex', alignItems: 'center', gap: 6, padding: '5px 14px', cursor: 'pointer', textDecoration: 'none', background: 'transparent', color };
  }

  cardStyle(focused) {
    return {
      display: 'block', textDecoration: 'none', padding: 16, borderRadius: 4,
      background: focused ? 'rgba(97,175,239,0.08)' : '#2c313c',
      boxShadow: focused ? 'inset 0 0 0 1px #61afef' : 'inset 0 0 0 1px #181a1f',
    };
  }

  renderVals() {
    const withIndex = this.items.map((it, i) => ({ ...it, i }));
    const sidebarItems = withIndex.filter(it => it.section === 'sidebar').map(it => ({
      ...it,
      style: this.sidebarStyle(it.color, it.i === this.state.focusIndex),
      refFn: (el) => { this.itemRefs[it.i] = el; },
    }));
    const projects = withIndex.filter(it => it.section === 'content').map(it => ({
      ...it,
      style: this.cardStyle(it.i === this.state.focusIndex),
      refFn: (el) => { this.itemRefs[it.i] = el; },
    }));
    return { sidebarItems, projects, clockText: this.state.clockText };
  }
}

class VimNavLocal {
  constructor({ count, onMove, onActivate }) {
    this.count = count; this.onMove = onMove; this.onActivate = onActivate; this._lastG = 0;
  }
  handleKey(e, currentIndex) {
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    const n = this.count();
    if (n <= 0) return;
    switch (e.key) {
      case 'j': case 'ArrowDown': e.preventDefault(); this.onMove(Math.min(currentIndex + 1, n - 1)); break;
      case 'k': case 'ArrowUp': e.preventDefault(); this.onMove(Math.max(currentIndex - 1, 0)); break;
      case 'G': e.preventDefault(); this.onMove(n - 1); break;
      case 'g': {
        const now = Date.now();
        if (now - this._lastG < 500) { e.preventDefault(); this.onMove(0); this._lastG = 0; }
        else { this._lastG = now; }
        break;
      }
      case 'Enter': case 'l': e.preventDefault(); this.onActivate(currentIndex); break;
      default: break;
    }
  }
}
</script>
</body>
</html>
